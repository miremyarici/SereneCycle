services:
  postgres:
    image: postgres:17-alpine
    container_name: serenecycle-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serenecycle}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: src/SereneCycle.Api/Dockerfile
    container_name: serenecycle-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-serenecycle};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      # Çift alt çizgi, iç içe yapılandırma anahtarlarını temsil eder.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY gerekli (en az 32 karakter)}
      Jwt__Issuer: ${JWT_ISSUER:-serene-cycle-api}
      Jwt__Audience: ${JWT_AUDIENCE:-serene-cycle-app}
      Gmail__UseRealSender: ${GMAIL_USE_REAL_SENDER:-false}
      Gmail__ClientId: ${GMAIL_CLIENT_ID:-}
      Gmail__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Gmail__RefreshToken: ${GMAIL_REFRESH_TOKEN:-}
      Gmail__SenderEmail: ${GMAIL_SENDER_EMAIL:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
